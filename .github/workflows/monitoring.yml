name: Monitoring Wisly w Toruniu

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-water:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja requests
        run: pip install requests

      - name: Uruchomienie skryptu
        run: python main.py

      - name: Zapisanie nowego stanu
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f last_state.txt ]; then
            git add last_state.txt
            git diff --staged --quiet || (git commit -m "Aktualizacja stanu wody [skip ci]" && git push)
          fi
